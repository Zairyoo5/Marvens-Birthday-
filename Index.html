<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvens' Birthday 🎂</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81, #7c3aed);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    

    .card {
      width: 85%;
      max-width: 600px;
      padding: 40px 25px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 45px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 28px;
      margin-top: 10px;
    }

    p {
      font-size: 19px;
      line-height: 1.6;
    }

    .cake {
      font-size: 80px;
      margin: 20px;
    }

    button {
      background: #facc15;
      color: #111827;
      border: none;
      padding: 15px 25px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }

    #message {
      display: none;
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="cake">🎂</div>

    <h1>Happy Birthday, Marvens! 🎉</h1>

    <h2>Celebrating 16 Amazing Years! 🥳</h2>

    <p>
      Wishing you a birthday filled with happiness,
      laughter, love, and unforgettable memories.
    </p>

    <button onclick="showMessage()">🎁 Open Your Birthday Message</button>

    <p id="message">
      🎈 Happy 16th Birthday, Marvens! 🎈<br>
      May your special day be full of amazing moments my man🥹❤️!
    </p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";
    }
  </script>

</body>
</html>
